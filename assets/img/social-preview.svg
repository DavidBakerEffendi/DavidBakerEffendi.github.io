    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#1c1c1d" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="68" y="68" width="8" height="494" rx="4" fill="url(#accent)" />

